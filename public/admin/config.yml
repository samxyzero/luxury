backend:
  name: github
  repo: YOUR_GITHUB_USERNAME/YOUR_REPO_NAME
  branch: main
  auth_endpoint: api/auth

# Local dev: run `npx decap-server` alongside `npm run dev` and uncomment
# the line below to edit content locally without GitHub auth.
# local_backend: true

media_folder: public/uploads
public_folder: /uploads

publish_mode: simple

collections:
  - name: site
    label: Site Settings
    files:
      - file: content/site.json
        label: Site Settings
        name: site
        fields:
          - { label: Business Name, name: businessName, widget: string }
          - { label: Tagline, name: tagline, widget: string }
          - { label: SEO Meta Description, name: metaDescription, widget: text }
          - { label: Phone (with country code, for tel: links), name: phone, widget: string }
          - { label: Phone (display format), name: phoneDisplay, widget: string }
          - { label: WhatsApp Number (digits only, e.g. 9779800000000), name: whatsapp, widget: string }
          - { label: Email, name: email, widget: string }
          - label: Address
            name: address
            widget: object
            fields:
              - { label: Street / Landmark, name: line1, widget: string }
              - { label: Area, name: area, widget: string }
              - { label: City, name: city, widget: string }
              - { label: Postal Code, name: postalCode, widget: string }
              - { label: Country, name: country, widget: string }
              - { label: Google Maps Embed URL, name: mapEmbedUrl, widget: string, hint: "Google Maps > Share > Embed a map > copy the src URL" }
              - { label: Google Maps Link URL, name: mapsUrl, widget: string }
          - label: Business Hours
            name: hours
            widget: list
            fields:
              - { label: Day(s), name: day, widget: string }
              - { label: Time, name: time, widget: string }
          - label: Social Links
            name: social
            widget: object
            fields:
              - { label: Facebook URL, name: facebook, widget: string, required: false }
              - { label: Instagram URL, name: instagram, widget: string, required: false }
          - label: Hero Section
            name: hero
            widget: object
            fields:
              - { label: Eyebrow Text, name: eyebrow, widget: string }
              - { label: Headline, name: headline, widget: string }
              - { label: Highlighted Word, name: highlight, widget: string }
              - { label: Subheadline, name: subheadline, widget: text }
              - { label: Background Image, name: image, widget: image, choose_url: true }
              - { label: Primary Button Label, name: ctaPrimaryLabel, widget: string }
              - { label: Secondary Button Label, name: ctaSecondaryLabel, widget: string }
          - label: About Section
            name: about
            widget: object
            fields:
              - { label: Eyebrow Text, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - label: Body Paragraphs
                name: body
                widget: list
                field: { label: Paragraph, name: paragraph, widget: text }
              - { label: Image, name: image, widget: image, choose_url: true }
              - { label: Years of Experience, name: yearsExperience, widget: number, value_type: int }
              - label: Highlights
                name: highlights
                widget: list
                field: { label: Highlight, name: highlight, widget: string }
          - label: Trust Stats
            name: stats
            widget: list
            fields:
              - { label: ID, name: id, widget: string }
              - { label: Label, name: label, widget: string }
              - { label: Value, name: value, widget: number, value_type: float }
              - { label: Suffix, name: suffix, widget: string, required: false }

  - name: products
    label: Products
    files:
      - file: content/products.json
        label: Products
        name: products
        fields:
          - label: Products
            name: items
            widget: list
            fields:
              - { label: ID (unique, no spaces), name: id, widget: string }
              - { label: Name, name: name, widget: string }
              - { label: Category, name: category, widget: string }
              - { label: Description, name: description, widget: text }
              - { label: Image, name: image, widget: image, choose_url: true }

  - name: services
    label: Services
    files:
      - file: content/services.json
        label: Services
        name: services
        fields:
          - label: Services
            name: items
            widget: list
            fields:
              - { label: ID (unique, no spaces), name: id, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }
              - label: Icon
                name: icon
                widget: select
                options: [home, "building-2", ruler, "message-circle", truck, wrench]

  - name: gallery
    label: Gallery
    files:
      - file: content/gallery.json
        label: Gallery
        name: gallery
        fields:
          - label: Gallery Items
            name: items
            widget: list
            fields:
              - { label: ID (unique, no spaces), name: id, widget: string }
              - { label: Image, name: image, widget: image, choose_url: true }
              - { label: Caption, name: caption, widget: string }
              - { label: Category, name: category, widget: string }

  - name: reviews
    label: Customer Reviews
    files:
      - file: content/reviews.json
        label: Reviews
        name: reviews
        fields:
          - label: Reviews
            name: items
            widget: list
            fields:
              - { label: ID (unique, no spaces), name: id, widget: string }
              - { label: Customer Name, name: name, widget: string }
              - { label: Role / Context, name: role, widget: string }
              - { label: Rating (1-5), name: rating, widget: number, value_type: int, min: 1, max: 5 }
              - { label: Quote, name: quote, widget: text }
              - { label: Source, name: source, widget: string }

  - name: faq
    label: FAQ
    files:
      - file: content/faq.json
        label: FAQ
        name: faq
        fields:
          - label: Questions
            name: items
            widget: list
            fields:
              - { label: ID (unique, no spaces), name: id, widget: string }
              - { label: Question, name: question, widget: string }
              - { label: Answer, name: answer, widget: text }

  - name: partners
    label: Brand Partners
    files:
      - file: content/partners.json
        label: Partners
        name: partners
        fields:
          - label: Partners
            name: items
            widget: list
            fields:
              - { label: ID (unique, no spaces), name: id, widget: string }
              - { label: Name, name: name, widget: string }
